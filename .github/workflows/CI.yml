name: CI
on:
  workflow_dispatch:
#  push:
#  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-2022 ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Project setup
      uses: bpmn-io/actions/setup@c662c7dd167d24b5f9a1e46b366ec4b4eb416831 # latest
    - name: Build with code coverage
      if: ${{ runner.OS == 'Linux' }}
      run: COVERAGE=1 npm run all -- --x64 --no-compress
    - name: Build
      if: ${{ runner.OS != 'Linux' }}
      run: npm run all -- --x64 --no-compress
    - name: Import Secrets
      if: ${{ runner.OS == 'Linux' }}
      id: secrets
      uses: hashicorp/vault-action@d1720f055e0635fd932a1d2a48f87a666a57906c # v3.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: approle
        roleId: ${{ secrets.VAULT_ROLE_ID }}
        secretId: ${{ secrets.VAULT_SECRET_ID }}
        exportEnv: false
        secrets: |
          secret/data/products/desktop-modeler/ci/CODECOV_TOKEN CODECOV_TOKEN;
    - name: Upload coverage
      if: ${{ runner.OS == 'Linux' }}
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
      with:
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ steps.secrets.outputs.CODECOV_TOKEN }}
